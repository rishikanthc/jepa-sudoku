[language-server.ty]
command = "uv"
args = ["run", "ty", "server"]

[language-server.ruff]
command = "uv"
args = ["run", "ruff", "server"]

[[language]]
name = "python"
language-servers = ["ty", "ruff"]
auto-format = true

[language.formatter]
command = "uv"
args = ["run", "ruff", "format", "--stdin-filename", "%{buffer_name}", "-"]
