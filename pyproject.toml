[project]
name = "jepa-sudoku"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "einops>=0.8.2",
    "gradio>=6.9.0",
    "marimo>=0.21.1",
    "matplotlib>=3.10.8",
    "pytest>=9.0.2",
    "torch>=2.11.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15.7",
    "ty>=0.0.24",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I"]
